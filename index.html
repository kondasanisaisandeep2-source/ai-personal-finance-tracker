<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <main class="todo-app">
        <header class="app-header">
          <div>
            <p class="eyebrow">Productivity</p>
            <h1>My To-Do List</h1>
          </div>
          <div class="stats-pill">
            <span id="task-count">0</span>
            <small>tasks</small>
          </div>
        </header>

        <form id="todo-form" class="todo-form">
          <input
            id="todo-input"
            type="text"
            placeholder="Add a new task"
            aria-label="Add a new task"
            maxlength="120"
            autocomplete="off"
          />
          <button type="submit">Add Task</button>
        </form>

        <div class="toolbar" aria-label="Task filters">
          <div class="filter-group">
            <button class="filter-btn active" data-filter="all" type="button">All</button>
            <button class="filter-btn" data-filter="active" type="button">Active</button>
            <button class="filter-btn" data-filter="completed" type="button">Completed</button>
          </div>
          <button id="clear-completed" class="secondary-btn" type="button">Clear completed</button>
        </div>

        <ul id="todo-list" class="todo-list" aria-live="polite"></ul>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
